<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="comparison-title comparison-desc">
  <title id="comparison-title">臺北市總統與市長選舉候選人類別得票率比較</title>
  <desc id="comparison-desc">總統選舉 2000 至 2024 年與市長選舉 2002 至 2022 年分成兩個不相連的面板；兩個面板使用相同的 0–70% 縱軸，並以相同顏色表示泛藍、泛綠和其他候選人。市長選舉採聯盟口徑。</desc>
  <style>
    text { fill: #172033; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; font-size: 14px; }
    .title { font-size: 25px; font-weight: 500; }
    .panel-title { font-size: 18px; font-weight: 500; }
    .subtitle, .tick, .note { fill: #596579; font-size: 12px; }
    .center { text-anchor: middle; }
    .end { text-anchor: end; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .comparison-line { fill: none; stroke-width: 3.2; stroke-linejoin: round; stroke-linecap: round; }
    .comparison-line.blue, .comparison-point.blue, .legend-line.blue { stroke: #2870a7; }
    .comparison-line.green, .comparison-point.green, .legend-line.green { stroke: #2f855a; }
    .comparison-line.other, .comparison-point.other, .legend-line.other { stroke: #d97706; }
    .comparison-point.blue { fill: #2870a7; }
    .comparison-point.green { fill: #2f855a; }
    .comparison-point.other { fill: #d97706; }
    .legend-line { stroke-width: 4; }
    .legend, .last-values { font-weight: 500; }
    .last-values { font-size: 12px; }
  </style>
  <rect width="1200" height="620" fill="#ffffff" />
  <text class="title" x="50" y="43">臺北市總統與市長選舉得票結構比較</text>
  <text class="subtitle" x="50" y="70">兩種選舉分開連線；市長選舉採聯盟口徑，兩圖共用 0–70% 比例尺。</text>
  <g aria-label="候選人類別圖例">
    <g transform="translate(745 46)"><line class="legend-line blue" x1="0" y1="0" x2="24" y2="0" /><text class="legend" x="32" y="5">泛藍</text></g>
    <g transform="translate(850 46)"><line class="legend-line green" x1="0" y1="0" x2="24" y2="0" /><text class="legend" x="32" y="5">泛綠</text></g>
    <g transform="translate(955 46)"><line class="legend-line other" x1="0" y1="0" x2="24" y2="0" /><text class="legend" x="32" y="5">其他候選人</text></g>
  </g>
  <g class="comparison-panel" aria-label="總統選舉候選人類別得票率"><text class="panel-title" x="70" y="112">總統選舉 2000–2024</text><line class="grid" x1="70" y1="495.00" x2="525" y2="495.00" /><text class="tick end" x="58" y="500.00">0%</text><line class="grid" x1="70" y1="445.00" x2="525" y2="445.00" /><text class="tick end" x="58" y="450.00">10%</text><line class="grid" x1="70" y1="395.00" x2="525" y2="395.00" /><text class="tick end" x="58" y="400.00">20%</text><line class="grid" x1="70" y1="345.00" x2="525" y2="345.00" /><text class="tick end" x="58" y="350.00">30%</text><line class="grid" x1="70" y1="295.00" x2="525" y2="295.00" /><text class="tick end" x="58" y="300.00">40%</text><line class="grid" x1="70" y1="245.00" x2="525" y2="245.00" /><text class="tick end" x="58" y="250.00">50%</text><line class="grid" x1="70" y1="195.00" x2="525" y2="195.00" /><text class="tick end" x="58" y="200.00">60%</text><line class="grid" x1="70" y1="145.00" x2="525" y2="145.00" /><text class="tick end" x="58" y="150.00">70%</text><text class="tick center" x="70.00" y="522">2000</text><text class="tick center" x="145.83" y="522">2004</text><text class="tick center" x="221.67" y="522">2008</text><text class="tick center" x="297.50" y="522">2012</text><text class="tick center" x="373.33" y="522">2016</text><text class="tick center" x="449.17" y="522">2020</text><text class="tick center" x="525.00" y="522">2024</text><polyline class="comparison-line blue" points="70.00,186.56 145.83,212.34 221.67,179.84 297.50,192.72 373.33,254.79 449.17,263.26 525.00,304.58" /><circle class="comparison-point blue" cx="70.00" cy="186.56" r="4.5"><title>2000 泛藍 61.69%</title></circle><circle class="comparison-point blue" cx="145.83" cy="212.34" r="4.5"><title>2004 泛藍 56.53%</title></circle><circle class="comparison-point blue" cx="221.67" cy="179.84" r="4.5"><title>2008 泛藍 63.03%</title></circle><circle class="comparison-point blue" cx="297.50" cy="192.72" r="4.5"><title>2012 泛藍 60.46%</title></circle><circle class="comparison-point blue" cx="373.33" cy="254.79" r="4.5"><title>2016 泛藍 48.04%</title></circle><circle class="comparison-point blue" cx="449.17" cy="263.26" r="4.5"><title>2020 泛藍 46.35%</title></circle><circle class="comparison-point blue" cx="525.00" cy="304.58" r="4.5"><title>2024 泛藍 38.08%</title></circle><polyline class="comparison-line green" points="70.00,306.78 145.83,277.66 221.67,310.16 297.50,297.28 373.33,235.21 449.17,226.74 525.00,304.37" /><circle class="comparison-point green" cx="70.00" cy="306.78" r="4.5"><title>2000 泛綠 37.64%</title></circle><circle class="comparison-point green" cx="145.83" cy="277.66" r="4.5"><title>2004 泛綠 43.47%</title></circle><circle class="comparison-point green" cx="221.67" cy="310.16" r="4.5"><title>2008 泛綠 36.97%</title></circle><circle class="comparison-point green" cx="297.50" cy="297.28" r="4.5"><title>2012 泛綠 39.54%</title></circle><circle class="comparison-point green" cx="373.33" cy="235.21" r="4.5"><title>2016 泛綠 51.96%</title></circle><circle class="comparison-point green" cx="449.17" cy="226.74" r="4.5"><title>2020 泛綠 53.65%</title></circle><circle class="comparison-point green" cx="525.00" cy="304.37" r="4.5"><title>2024 泛綠 38.13%</title></circle><polyline class="comparison-line other" points="70.00,491.66 145.83,495.00 221.67,495.00 297.50,495.00 373.33,495.00 449.17,495.00 525.00,376.05" /><circle class="comparison-point other" cx="70.00" cy="491.66" r="4.5"><title>2000 其他候選人 0.67%</title></circle><circle class="comparison-point other" cx="145.83" cy="495.00" r="4.5"><title>2004 其他候選人 0.00%</title></circle><circle class="comparison-point other" cx="221.67" cy="495.00" r="4.5"><title>2008 其他候選人 0.00%</title></circle><circle class="comparison-point other" cx="297.50" cy="495.00" r="4.5"><title>2012 其他候選人 0.00%</title></circle><circle class="comparison-point other" cx="373.33" cy="495.00" r="4.5"><title>2016 其他候選人 0.00%</title></circle><circle class="comparison-point other" cx="449.17" cy="495.00" r="4.5"><title>2020 其他候選人 0.00%</title></circle><circle class="comparison-point other" cx="525.00" cy="376.05" r="4.5"><title>2024 其他候選人 23.79%</title></circle><text class="last-values" x="70" y="556">2024：泛藍 38.08%　泛綠 38.13%　其他 23.79%</text></g>
  <g class="comparison-panel" aria-label="市長選舉聯盟口徑候選人類別得票率"><text class="panel-title" x="675" y="112">市長選舉 2002–2022</text><line class="grid" x1="675" y1="495.00" x2="1130" y2="495.00" /><line class="grid" x1="675" y1="445.00" x2="1130" y2="445.00" /><line class="grid" x1="675" y1="395.00" x2="1130" y2="395.00" /><line class="grid" x1="675" y1="345.00" x2="1130" y2="345.00" /><line class="grid" x1="675" y1="295.00" x2="1130" y2="295.00" /><line class="grid" x1="675" y1="245.00" x2="1130" y2="245.00" /><line class="grid" x1="675" y1="195.00" x2="1130" y2="195.00" /><line class="grid" x1="675" y1="145.00" x2="1130" y2="145.00" /><text class="tick center" x="675.00" y="522">2002</text><text class="tick center" x="766.00" y="522">2006</text><text class="tick center" x="857.00" y="522">2010</text><text class="tick center" x="948.00" y="522">2014</text><text class="tick center" x="1039.00" y="522">2018</text><text class="tick center" x="1130.00" y="522">2022</text><polyline class="comparison-line blue" points="675.00,174.46 766.00,205.22 857.00,216.75 948.00,290.88 1039.00,290.92 1130.00,283.53" /><circle class="comparison-point blue" cx="675.00" cy="174.46" r="4.5"><title>2002 泛藍 64.11%</title></circle><circle class="comparison-point blue" cx="766.00" cy="205.22" r="4.5"><title>2006 泛藍 57.96%</title></circle><circle class="comparison-point blue" cx="857.00" cy="216.75" r="4.5"><title>2010 泛藍 55.65%</title></circle><circle class="comparison-point blue" cx="948.00" cy="290.88" r="4.5"><title>2014 泛藍 40.82%</title></circle><circle class="comparison-point blue" cx="1039.00" cy="290.92" r="4.5"><title>2018 泛藍 40.82%</title></circle><circle class="comparison-point blue" cx="1130.00" cy="283.53" r="4.5"><title>2022 泛藍 42.29%</title></circle><polyline class="comparison-line green" points="675.00,315.54 766.00,289.24 857.00,275.95 948.00,209.20 1039.00,408.59 1130.00,335.35" /><circle class="comparison-point green" cx="675.00" cy="315.54" r="4.5"><title>2002 泛綠 35.89%</title></circle><circle class="comparison-point green" cx="766.00" cy="289.24" r="4.5"><title>2006 泛綠 41.15%</title></circle><circle class="comparison-point green" cx="857.00" cy="275.95" r="4.5"><title>2010 泛綠 43.81%</title></circle><circle class="comparison-point green" cx="948.00" cy="209.20" r="4.5"><title>2014 泛綠 57.16%</title></circle><circle class="comparison-point green" cx="1039.00" cy="408.59" r="4.5"><title>2018 泛綠 17.28%</title></circle><circle class="comparison-point green" cx="1130.00" cy="335.35" r="4.5"><title>2022 泛綠 31.93%</title></circle><polyline class="comparison-line other" points="675.00,495.00 766.00,490.54 857.00,492.30 948.00,484.92 1039.00,285.49 1130.00,366.12" /><circle class="comparison-point other" cx="675.00" cy="495.00" r="4.5"><title>2002 其他候選人 0.00%</title></circle><circle class="comparison-point other" cx="766.00" cy="490.54" r="4.5"><title>2006 其他候選人 0.89%</title></circle><circle class="comparison-point other" cx="857.00" cy="492.30" r="4.5"><title>2010 其他候選人 0.54%</title></circle><circle class="comparison-point other" cx="948.00" cy="484.92" r="4.5"><title>2014 其他候選人 2.02%</title></circle><circle class="comparison-point other" cx="1039.00" cy="285.49" r="4.5"><title>2018 其他候選人 41.90%</title></circle><circle class="comparison-point other" cx="1130.00" cy="366.12" r="4.5"><title>2022 其他候選人 25.78%</title></circle><text class="last-values" x="675" y="556">2022：泛藍 42.29%　泛綠 31.93%　其他 25.78%</text></g>
  <text class="note" x="50" y="596">線段只連接同一選舉類型的相鄰年份；「其他候選人」是選票分類，不等同所有中間選民。</text>
</svg>
