2014 聯盟口徑 其他候選人 2.02%</title></circle><circle class="mayor-point coalition other" cx="900.00" cy="266.39" r="4.5"><title>2018 聯盟口徑 其他候選人 41.90%</title></circle><circle class="mayor-point coalition other" cx="1102.00" cy="330.89" r="4.5"><title>2022 聯盟口徑 其他候選人 25.78%</title></circle><polyline class="mayor-line official other" points="92.00,434.00 294.00,412.81 496.00,431.84 698.00,197.30 900.00,266.39 1102.00,330.89" /><circle class="mayor-point official other" cx="92.00" cy="434.00" r="3.2"><title>2002 官方提名口徑 其他候選人 0.00%</title></circle><circle class="mayor-point official other" cx="294.00" cy="412.81" r="3.2"><title>2006 官方提名口徑 其他候選人 5.30%</title></circle><circle class="mayor-point official other" cx="496.00" cy="431.84" r="3.2"><title>2010 官方提名口徑 其他候選人 0.54%</title></circle><circle class="mayor-point official other" cx="698.00" cy="197.30" r="3.2"><title>2014 官方提名口徑 其他候選人 59.18%</title></circle><circle class="mayor-point official other" cx="900.00" cy="266.39" r="3.2"><title>2018 官方提名口徑 其他候選人 41.90%</title></circle><circle class="mayor-point official other" cx="1102.00" cy="330.89" r="3.2"><title>2022 官方提名口徑 其他候選人 25.78%</title></circle>
    <text class="annotation center" x="698.00" y="485">2014 分類差異：柯文哲列入聯盟泛綠，官方提名口徑列為其他</text>
  </g>
  <g aria-label="聯盟口徑最低淨移動規模">
    <text class="panel-title" x="50" y="525">聯盟口徑：相對前一屆的最低淨移動規模</text>
    <line class="grid" x1="125" y1="680" x2="1070" y2="680" />
    <rect class="mayor-volatility-bar" x="173.50" y="663.66" width="92.00" height="16.34" rx="5"><title>2006 6.15 pp／79,126 票等值</title></rect><text class="bar-value center" x="219.50" y="654.66">6.15 pp</text><text class="tick center" x="219.50" y="703">2006</text><text class="vote-note center" x="219.50" y="722">79,126 票等值</text><rect class="mayor-volatility-bar" x="362.50" y="672.94" width="92.00" height="7.06" rx="5"><title>2010 2.66 pp／38,129 票等值</title></rect><text class="bar-value center" x="408.50" y="663.94">2.66 pp</text><text class="tick center" x="408.50" y="703">2010</text><text class="vote-note center" x="408.50" y="722">38,129 票等值</text><rect class="mayor-volatility-bar" x="551.50" y="640.62" width="92.00" height="39.38" rx="5"><title>2014 14.83 pp／221,495 票等值</title></rect><text class="bar-value center" x="597.50" y="631.62">14.83 pp</text><text class="tick center" x="597.50" y="703">2014</text><text class="vote-note center" x="597.50" y="722">221,495 票等值</text><rect class="mayor-volatility-bar" x="740.50" y="574.07" width="92.00" height="105.93" rx="5"><title>2018 39.88 pp／563,918 票等值</title></rect><text class="bar-value center" x="786.50" y="565.07">39.88 pp</text><text class="tick center" x="786.50" y="703">2018</text><text class="vote-note center" x="786.50" y="722">563,918 票等值</text><rect class="mayor-volatility-bar" x="929.50" y="637.17" width="92.00" height="42.83" rx="5"><title>2022 16.13 pp／219,455 票等值</title></rect><text class="bar-value center" x="975.50" y="628.17">16.13 pp</text><text class="tick center" x="975.50" y="703">2022</text><text class="vote-note center" x="975.50" y="722">219,455 票等值</text>
  </g>
  <text class="note" x="50" y="778">「其他候選人」不是所有中間選民；最低淨移動規模是三類聚合得票率變化的一半，也包含投票率與選民結構變化。</text>
</svg>
