    <polyline class="share-line blue" points="90.00,149.68 260.00,168.10 430.00,144.88 600.00,154.08 770.00,198.42 940.00,204.47 1110.00,233.99" /><circle class="share-point blue" cx="90.00" cy="149.68" r="4.5"><title>2000 泛藍 61.69%</title></circle><circle class="share-point blue" cx="260.00" cy="168.10" r="4.5"><title>2004 泛藍 56.53%</title></circle><circle class="share-point blue" cx="430.00" cy="144.88" r="4.5"><title>2008 泛藍 63.03%</title></circle><circle class="share-point blue" cx="600.00" cy="154.08" r="4.5"><title>2012 泛藍 60.46%</title></circle><circle class="share-point blue" cx="770.00" cy="198.42" r="4.5"><title>2016 泛藍 48.04%</title></circle><circle class="share-point blue" cx="940.00" cy="204.47" r="4.5"><title>2020 泛藍 46.35%</title></circle><circle class="share-point blue" cx="1110.00" cy="233.99" r="4.5"><title>2024 泛藍 38.08%</title></circle><polyline class="share-line green" points="90.00,235.56 260.00,214.76 430.00,237.97 600.00,228.77 770.00,184.44 940.00,178.38 1110.00,233.84" /><circle class="share-point green" cx="90.00" cy="235.56" r="4.5"><title>2000 泛綠 37.64%</title></circle><circle class="share-point green" cx="260.00" cy="214.76" r="4.5"><title>2004 泛綠 43.47%</title></circle><circle class="share-point green" cx="430.00" cy="237.97" r="4.5"><title>2008 泛綠 36.97%</title></circle><circle class="share-point green" cx="600.00" cy="228.77" r="4.5"><title>2012 泛綠 39.54%</title></circle><circle class="share-point green" cx="770.00" cy="184.44" r="4.5"><title>2016 泛綠 51.96%</title></circle><circle class="share-point green" cx="940.00" cy="178.38" r="4.5"><title>2020 泛綠 53.65%</title></circle><circle class="share-point green" cx="1110.00" cy="233.84" r="4.5"><title>2024 泛綠 38.13%</title></circle><polyline class="share-line other" points="90.00,367.62 260.00,370.00 430.00,370.00 600.00,370.00 770.00,370.00 940.00,370.00 1110.00,285.03" /><circle class="share-point other" cx="90.00" cy="367.62" r="4.5"><title>2000 其他候選人 0.67%</title></circle><circle cla