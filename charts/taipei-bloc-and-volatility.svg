  </g>
  <g aria-label="最低淨移動規模">
    <text class="panel-title" x="50" y="440">相對前一屆的最低淨移動規模</text>
    <line class="grid" x1="110" y1="615" x2="1090" y2="615" />
    <rect class="volatility-bar" x="146.67" y="583.30" width="90.00" height="31.70" rx="5"><title>2004 5.82 pp／92,506 票等值</title></rect><text class="bar-value center" x="191.67" y="573.30">5.82 pp</text><text class="tick center" x="191.67" y="639">2004</text><text class="vote-note center" x="191.67" y="658">92,506 票等值</text><rect class="volatility-bar" x="310.00" y="579.63" width="90.00" height="35.37" rx="5"><title>2008 6.50 pp／104,317 票等值</title></rect><text class="bar-value center" x="355.00" y="569.63">6.50 pp</text><text class="tick center" x="355.00" y="639">2008</text><text class="vote-note center" x="355.00" y="658">104,317 票等值</text><rect class="volatility-bar" x="473.33" y="600.98" width="90.00" height="14.02" rx="5"><title>2012 2.58 pp／41,335 票等值</title></rect><text class="bar-value center" x="518.33" y="590.98">2.58 pp</text><text class="tick center" x="518.33" y="639">2012</text><text class="vote-note center" x="518.33" y="658">41,335 票等值</text><rect class="volatility-bar" x="636.67" y="547.44" width="90.00" height="67.56" rx="5"><title>2016 12.41 pp／180,968 票等值</title></rect><text class="bar-value center" x="681.67" y="537.44">12.41 pp</text><text class="tick center" x="681.67" y="639">2016</text><text class="vote-note center" x="681.67" y="658">180,968 票等值</text><rect class="volatility-bar" x="800.00" y="605.78" width="90.00" height="9.22" rx="5"><title>2020 1.69 pp／27,660 票等值</title></rect><text class="bar-value center" x="845.00" y="595.78">1.69 pp</text><text class="tick center" x="845.00" y="639">2020</text><text class="vote-note center" x="845.00" y="658">27,660 票等值</text><rect class="volatility-bar" x="963.33" y="485.54" width="90.00" height="129.46" rx="5"><title>2024 23.79 pp／366,854 票等值</title></rect><text class="bar-value center" x="1008.33" y="475.54">23.79 pp</text><text class="tick center" x="1008.33" y="639">2024</text><text class="vote-note center" x="1008.33" y="658">366,854 票等值</text>
